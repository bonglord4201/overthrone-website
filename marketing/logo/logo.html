<!doctype html>
<!-- OVERTHRONE brand marks, drawn as vector art (no AI): render with make_logo.mjs.
     Each <svg> with an id is screenshotted on its own with a transparent background. -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: Cinzel; src: url('fonts/Cinzel.ttf'); font-weight: 400 900; }
  body { margin: 0; background: transparent; }
  svg { display: block; }
  text { font-family: Cinzel; font-weight: 900; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- polished steel: bright top, dark horizon line, bright reflection, dark base -->
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.38" stop-color="#d9dce2"/>
      <stop offset="0.5" stop-color="#7d838d"/><stop offset="0.56" stop-color="#eef0f3"/>
      <stop offset="1" stop-color="#8e949e"/>
    </linearGradient>
    <linearGradient id="steelText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#dfe2e7"/>
      <stop offset="0.52" stop-color="#7b818b"/><stop offset="0.6" stop-color="#f1f2f5"/>
      <stop offset="1" stop-color="#a3a8b1"/>
    </linearGradient>
    <linearGradient id="steelH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef0f3"/><stop offset="0.5" stop-color="#c9cdd3"/><stop offset="0.5" stop-color="#7d838d"/><stop offset="1" stop-color="#4c515a"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a6a"/><stop offset="0.5" stop-color="#d0102c"/><stop offset="1" stop-color="#6e0014"/>
    </linearGradient>
    <linearGradient id="redmetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b78"/><stop offset="0.48" stop-color="#d4142f"/>
      <stop offset="0.55" stop-color="#7a0016"/><stop offset="0.62" stop-color="#e3253f"/><stop offset="1" stop-color="#8f0a1f"/>
    </linearGradient>
    <radialGradient id="badgeBg" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#4a0710"/><stop offset="0.55" stop-color="#1b0306"/><stop offset="1" stop-color="#070102"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b"/>
      <feFlood flood-color="#ff1a3a" flood-opacity="0.55"/><feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.7"/>
    </filter>

    <!-- the crown, 400 x 250, centred on x = 200: blade spikes, curved outer horns -->
    <g id="crown">
      <path id="crownShape" d="M58,206 C44,172 32,140 18,92 L74,148 L94,102 L116,160 L140,44 L168,150 L200,0 L232,150 L260,44 L284,160 L306,102 L326,148 L382,92 C368,140 356,172 342,206 Q200,190 58,206 Z"/>
      <use href="#crownShape" fill="none" stroke="#120205" stroke-width="16" stroke-linejoin="round"/>
      <use href="#crownShape" fill="url(#steel)"/>
      <!-- right half of every blade in shadow: a ground metal edge -->
      <g fill="#1a0a10" opacity="0.32">
        <path d="M200,0 L232,150 L200,166 Z"/><path d="M140,44 L168,150 L140,160 Z"/><path d="M260,44 L284,160 L260,160 Z"/>
        <path d="M94,102 L116,160 L94,166 Z"/><path d="M306,102 L326,148 L306,166 Z"/>
        <path d="M18,92 L74,148 L62,176 C52,150 40,124 18,92 Z"/><path d="M382,92 C368,140 356,172 342,206 L330,170 Z"/>
      </g>
      <g stroke="#ffffff" stroke-opacity="0.75" stroke-width="2" fill="none">
        <path d="M200,6 L200,160"/><path d="M140,52 L140,156"/><path d="M260,52 L260,156"/><path d="M94,110 L94,162"/><path d="M306,110 L306,162"/>
      </g>
      <use href="#crownShape" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-linejoin="round"/>
      <!-- band -->
      <path id="band" d="M54,206 Q200,188 346,206 L340,246 Q200,230 60,246 Z"/>
      <use href="#band" fill="none" stroke="#120205" stroke-width="14" stroke-linejoin="round"/>
      <use href="#band" fill="url(#steel)"/>
      <path d="M64,214 Q200,198 336,214" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5"/>
      <path d="M66,238 Q200,222 334,238" fill="none" stroke="#5c626c" stroke-width="3"/>
      <g stroke="#120205" stroke-width="5" stroke-linejoin="round">
        <path d="M200,202 L218,218 L200,234 L182,218 Z" fill="url(#ruby)"/>
        <path d="M120,212 L131,222 L120,232 L109,222 Z" fill="url(#ruby)"/>
        <path d="M280,212 L291,222 L280,232 L269,222 Z" fill="url(#ruby)"/>
        <path d="M200,104 L220,134 L200,166 L180,134 Z" fill="url(#ruby)"/>
      </g>
      <g fill="#ffffff" opacity="0.85"><path d="M200,110 L208,130 L200,124 Z"/><path d="M200,208 L206,216 L200,214 Z"/></g>
    </g>

    <!-- a long sword, point down, 120 x 900, centred on x = 60 -->
    <g id="sword">
      <path id="blade" d="M44,170 L76,170 L74,800 L60,900 L46,800 Z"/>
      <use href="#blade" fill="none" stroke="#120205" stroke-width="10" stroke-linejoin="round"/>
      <use href="#blade" fill="url(#steelH)"/>
      <path d="M60,176 L60,880" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
      <path d="M0,150 Q60,128 120,150 L120,174 Q60,156 0,174 Z" fill="url(#steel)" stroke="#120205" stroke-width="7" stroke-linejoin="round"/>
      <rect x="50" y="40" width="20" height="112" rx="5" fill="#3a0a12" stroke="#120205" stroke-width="6"/>
      <circle cx="60" cy="30" r="20" fill="url(#ruby)" stroke="#120205" stroke-width="6"/>
    </g>
    <!-- small spear-point ornament used beside "SMP" -->
    <g id="spear"><path d="M0,0 L150,-5 L170,0 L150,5 Z" fill="url(#redmetal)" stroke="#120205" stroke-width="2"/></g>
  </defs>
</svg>

<!-- 1) wordmark, transparent: crown over OVERTHRONE, SMP between spear lines -->
<svg id="wordmark" width="2000" height="1000" viewBox="0 0 2000 1000">
  <g filter="url(#shadow)">
    <use href="#crown" transform="translate(760,70) scale(1.2)" filter="url(#glow)"/>
    <!-- depth layer, then dark outline, then steel face -->
    <text x="1000" y="676" text-anchor="middle" font-size="236" letter-spacing="10" fill="#7a0016" stroke="#7a0016" stroke-width="18" stroke-linejoin="round">OVERTHRONE</text>
    <text x="1000" y="664" text-anchor="middle" font-size="236" letter-spacing="10" fill="#120205" stroke="#120205" stroke-width="16" stroke-linejoin="round">OVERTHRONE</text>
    <text x="1000" y="664" text-anchor="middle" font-size="236" letter-spacing="10" fill="url(#steelText)">OVERTHRONE</text>
    <text x="1000" y="664" text-anchor="middle" font-size="236" letter-spacing="10" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="2">OVERTHRONE</text>
    <use href="#spear" transform="translate(800,790) scale(-1,1)"/>
    <use href="#spear" transform="translate(1200,790)"/>
    <text x="1000" y="826" text-anchor="middle" font-size="96" letter-spacing="34" fill="#120205" stroke="#120205" stroke-width="12" stroke-linejoin="round">SMP</text>
    <text x="1000" y="826" text-anchor="middle" font-size="96" letter-spacing="34" fill="url(#redmetal)">SMP</text>
  </g>
</svg>

<!-- 2) profile badge, 1080 x 1080, safe inside a circle crop -->
<svg id="badge" width="1080" height="1080" viewBox="0 0 1080 1080">
  <circle cx="540" cy="540" r="536" fill="url(#badgeBg)"/>
  <circle cx="540" cy="540" r="508" fill="none" stroke="url(#steel)" stroke-width="10"/>
  <circle cx="540" cy="540" r="490" fill="none" stroke="#d0102c" stroke-width="4" opacity="0.9"/>
  <!-- faint rays behind the crown -->
  <g opacity="0.16" stroke="#ff3b4e" stroke-width="3">
    <line x1="540" y1="420" x2="540" y2="80"/><line x1="540" y1="420" x2="330" y2="130"/><line x1="540" y1="420" x2="750" y2="130"/>
    <line x1="540" y1="420" x2="190" y2="280"/><line x1="540" y1="420" x2="890" y2="280"/>
  </g>
  <use href="#sword" transform="translate(486,150) scale(0.9,0.95)"/>
  <use href="#crown" transform="translate(290,150) scale(1.25)" filter="url(#glow)"/>
  <g filter="url(#shadow)">
    <text x="540" y="636" text-anchor="middle" font-size="142" letter-spacing="4" textLength="840" lengthAdjust="spacingAndGlyphs" fill="#7a0016" stroke="#7a0016" stroke-width="12" stroke-linejoin="round">OVERTHRONE</text>
    <text x="540" y="628" text-anchor="middle" font-size="142" letter-spacing="4" textLength="840" lengthAdjust="spacingAndGlyphs" fill="#120205" stroke="#120205" stroke-width="11" stroke-linejoin="round">OVERTHRONE</text>
    <text x="540" y="628" text-anchor="middle" font-size="142" letter-spacing="4" textLength="840" lengthAdjust="spacingAndGlyphs" fill="url(#steelText)">OVERTHRONE</text>
  </g>
  <use href="#spear" transform="translate(452,722) scale(-0.85,0.85)"/>
  <use href="#spear" transform="translate(628,722) scale(0.85,0.85)"/>
  <text x="540" y="752" text-anchor="middle" font-size="84" letter-spacing="26" fill="#120205" stroke="#120205" stroke-width="10" stroke-linejoin="round">SMP</text>
  <text x="540" y="752" text-anchor="middle" font-size="84" letter-spacing="26" fill="url(#redmetal)">SMP</text>
</svg>

<!-- 3) crown icon alone, transparent (server icon, favicon, watermark) -->
<svg id="icon" width="1024" height="1024" viewBox="0 0 1024 1024">
  <use href="#crown" transform="translate(82,230) scale(2.15)" filter="url(#glow)"/>
</svg>
</body></html>
